name: 构建 Android APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 准备 Web 资源
        run: |
          mkdir -p www
          cp index.html www/
          cp manifest.json www/
          cp -r icons www/

      - name: 初始化 Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "DayStudy" "com.study.pomodoro" --web-dir=www

      - name: 添加 Android 平台
        run: npx cap add android

      - name: 注入原生模块（通知 + 应用图标）
        run: |
          mkdir -p android/app/src/main/java/com/study/pomodoro
          cp native/TimerForegroundService.java native/TimerSoundReceiver.java native/TimerNotifierPlugin.java android/app/src/main/java/com/study/pomodoro/
          mkdir -p android/app/src/main/res/drawable
          cp native/ic_notification.xml android/app/src/main/res/drawable/
          cp -r native/android-res/. android/app/src/main/res/
          python3 native/patch_android.py android

      - name: 修复 Kotlin 依赖冲突
        run: |
          cat >> android/app/build.gradle << 'EOF'

          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
              }
          }
          EOF

      - name: 同步资源
        run: npx cap sync

      - name: 构建 APK
        run: cd android && ./gradlew assembleDebug

      - name: 重命名 APK 为「学习打卡」
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk 学习打卡.apk
          ls -lh 学习打卡.apk

      - name: 上传 APK 附件
        uses: actions/upload-artifact@v4
        with:
          name: 学习打卡
          path: 学习打卡.apk

      - name: 发布到 GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.4.0 --repo "${GITHUB_REPOSITORY}" --yes 2>/dev/null || true
          cat > RELEASE_NOTES.md << 'EOF'
          DayStudy v1.4.0（Android APK）

          中文介绍：
          - 原生前台服务通知：通知栏实时走秒显示剩余/已计时时间（系统 Chronometer，每秒刷新）
          - 锁屏/后台准点完成通知：到点响铃提醒（AlarmManager 精确闹钟）
          - 通知栏按钮：暂停/继续/停止，点击直接控制计时
          - 三种计时方式：番茄钟 / 倒计时 / 正计时
          - 番茄钟流程：专注结束自动进入 10 分钟休息，休息结束后才记录
          - 统计页：饼状图日/周/月/累计切换，任务明细，近 7 天柱状图
          - 数据导出/导入 JSON，本地存储

          English Introduction:
          - Native foreground service notification: live remaining/elapsed time in the status bar (system Chronometer, 1-second refresh)
          - Exact completion alarm: rings on time even when locked or backgrounded (AlarmManager setExactAndAllowWhileIdle)
          - Notification action buttons: pause/resume/stop
          - Three timer modes: Pomodoro / Countdown / Count-up
          - Data export/import JSON, stored locally

          下载后传到手机安装，需允许未知来源应用。
          Download and install on your phone; enable install-unknown-apps if prompted.
          EOF
          gh release create v1.4.0 --repo "${GITHUB_REPOSITORY}" \
            --title "学习打卡 Routine v1.4.0" \
            --notes-file RELEASE_NOTES.md
          mkdir -p release_pkg
          cp 学习打卡.apk release_pkg/学习打卡Routine-v1.4.0.apk
          python3 -c "import shutil; shutil.make_archive('Routine-v1.4.0', 'zip', 'release_pkg')"
          RELEASE_ID="$(gh release view v1.4.0 --repo "${GITHUB_REPOSITORY}" --json databaseId --jq '.databaseId')"
          curl -sS -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @Routine-v1.4.0.zip \
            "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=Routine-v1.4.0.zip"
